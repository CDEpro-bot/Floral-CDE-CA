<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floriculture CDE Test Bank</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2a28;--muted:#6f6a62;--accent:#b0476b;--accent2:#5c7a4a;--line:#e3ddd3;--good:#3f8a4f;--goodbg:#e6f3e8;--bad:#b23b3b;--badbg:#f9e5e5}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;margin-bottom:18px}
header h1{margin:0;font-size:1.7rem;color:var(--accent)}
header p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
h2{margin:0 0 12px;font-size:1.15rem}
.cats label,.modes label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.cats label:hover,.modes label:hover{background:#faf7f2}
.cats .count{margin-left:auto;color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
button.secondary{background:#ece6dc;color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:.95rem;flex-wrap:wrap;gap:8px}
.timer{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.progress div{height:100%;background:var(--accent2);width:0}
.tag{display:inline-block;font-size:.78rem;background:#f1e6ea;color:var(--accent);padding:2px 10px;border-radius:20px;margin-bottom:8px}
.qtext{font-size:1.12rem;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);padding:12px 14px;margin-bottom:9px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:#fbf1f4}
.opt.correct{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{opacity:1;cursor:default}
.letter{font-weight:700;margin-right:8px;color:var(--muted)}
.feedback{margin:6px 0 14px;font-weight:600}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.score{font-size:2.6rem;font-weight:800;color:var(--accent);text-align:center;margin:6px 0}
.sub{text-align:center;color:var(--muted);margin-bottom:14px}
.breakdown div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.review-item{border-top:1px solid var(--line);padding:12px 0}
.review-item .q{font-weight:600}
.review-item .yours{color:var(--bad)}
.review-item .ans{color:var(--good)}
.hidden{display:none}
.small{font-size:.88rem;color:var(--muted)}
input[type=number]{font:inherit;width:80px;padding:8px;border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🌸 Floriculture CDE Test Bank</h1>
  <p>250-question bank &middot; Nov 2021</p>
</header>

<!-- SETUP -->
<section id="setup">
  <div class="card">
    <h2>1. Choose topics</h2>
    <div class="cats" id="cats"></div>
    <div class="row"><button class="secondary" id="allBtn">Select all</button><button class="secondary" id="noneBtn">Clear</button></div>
  </div>
  <div class="card">
    <h2>2. Choose a mode</h2>
    <div class="modes">
      <label><input type="radio" name="mode" value="practice" checked> <span><b>Practice</b> — instant feedback after every question</span></label>
      <label><input type="radio" name="mode" value="contest"> <span><b>Contest simulation</b> — 25 random questions, 30-minute timer, 4 points each, scored at the end</span></label>
    </div>
    <div class="row" id="practiceOpts">
      <label class="small">Number of questions (blank = all selected):</label>
      <input type="number" id="numQ" min="1" placeholder="All">
      <label class="small"><input type="checkbox" id="shuffle" checked> Shuffle</label>
    </div>
  </div>
  <div class="card" style="text-align:center">
    <button id="startBtn">Start</button>
    <p class="small" id="poolInfo"></p>
  </div>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
  <div class="card">
    <div class="topbar"><span id="counter"></span><span class="timer" id="timer"></span><span id="liveScore"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <span class="tag" id="qcat"></span>
    <p class="qtext" id="qtext"></p>
    <div id="opts"></div>
    <div class="feedback" id="fb"></div>
    <div class="nav">
      <button class="secondary" id="prevBtn">← Back</button>
      <button class="secondary" id="quitBtn">Quit</button>
      <button id="nextBtn">Next →</button>
    </div>
  </div>
</section>

<!-- RESULTS -->
<section id="results" class="hidden">
  <div class="card">
    <h2 style="text-align:center">Results</h2>
    <div class="score" id="finalScore"></div>
    <div class="sub" id="finalSub"></div>
    <div class="breakdown" id="breakdown"></div>
    <div class="row" style="justify-content:center;margin-top:18px">
      <button id="retryMissed">Retry missed</button>
      <button class="secondary" id="homeBtn">New quiz</button>
    </div>
  </div>
  <div class="card"><h2>Review missed questions</h2><div id="review"></div></div>
</section>
</div>

const CATS = [
  {name:"Care & Handling of Cut Flowers", from:1, to:48},
  {name:"History of Floral Design", from:49, to:99},
  {name:"Principles of Design", from:100, to:149},
  {name:"Elements of Design & Color", from:150, to:199},
  {name:"Mechanics", from:200, to:250}
];
const catOf = n => CATS.findIndex(c => n>=c.from && n<=c.to);
const LETTERS = "abcd";

// Normalize bank into objects
const QUESTIONS = BANK.map(r => {
  const [num, text, ans, ...opts] = r;
  if (opts.length === 0) return {num, text, opts:["True","False"], correct: ans==="T"?0:1, cat:catOf(num), tf:true};
  return {num, text, opts, correct: LETTERS.indexOf(ans), cat:catOf(num), tf:false};
});

/* ---------- state ---------- */
let pool=[], idx=0, answers=[], mode="practice", timerId=null, timeLeft=0;
const $ = id => document.getElementById(id);

/* ---------- setup ---------- */
function buildCats(){
  $("cats").innerHTML = CATS.map((c,i)=>{
    const n = QUESTIONS.filter(q=>q.cat===i).length;
    return `<label><input type="checkbox" class="catbox" value="${i}" checked> ${c.name}<span class="count">${n} Qs</span></label>`;
  }).join("");
  document.querySelectorAll(".catbox").forEach(b=>b.onchange=updateInfo);
  updateInfo();
}
function selectedCats(){return [...document.querySelectorAll(".catbox:checked")].map(b=>+b.value);}
function updateInfo(){
  const n = QUESTIONS.filter(q=>selectedCats().includes(q.cat)).length;
  $("poolInfo").textContent = n+" questions available";
  $("startBtn").disabled = n===0;
}
$("allBtn").onclick=()=>{document.querySelectorAll(".catbox").forEach(b=>b.checked=true);updateInfo();};
$("noneBtn").onclick=()=>{document.querySelectorAll(".catbox").forEach(b=>b.checked=false);updateInfo();};
document.querySelectorAll("input[name=mode]").forEach(r=>r.onchange=()=>{
  $("practiceOpts").style.display = r.value==="practice"&&r.checked ? "flex" : (document.querySelector("input[name=mode]:checked").value==="practice"?"flex":"none");
});

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

$("startBtn").onclick=()=>{
  mode = document.querySelector("input[name=mode]:checked").value;
  let p = QUESTIONS.filter(q=>selectedCats().includes(q.cat));
  if (mode==="contest"){ p = shuffle(p).slice(0,25); }
  else {
    if ($("shuffle").checked) p = shuffle(p);
    const n = parseInt($("numQ").value);
    if (n>0) p = p.slice(0,n);
  }
  startQuiz(p);
};

function startQuiz(p){
  pool=p; idx=0; answers=new Array(p.length).fill(null);
  $("setup").classList.add("hidden"); $("results").classList.add("hidden"); $("quiz").classList.remove("hidden");
  clearInterval(timerId); $("timer").textContent="";
  if (mode==="contest"){
    timeLeft = 30*60; tick();
    timerId = setInterval(()=>{timeLeft--; tick(); if(timeLeft<=0){clearInterval(timerId); finish();}},1000);
  }
  render();
}
function tick(){
  const m=Math.floor(timeLeft/60), s=String(timeLeft%60).padStart(2,"0");
  $("timer").textContent = "⏱ "+m+":"+s;
  $("timer").classList.toggle("low", timeLeft<=120);
}

/* ---------- quiz ---------- */
function render(){
  const q = pool[idx], a = answers[idx];
  $("counter").textContent = `Question ${idx+1} of ${pool.length}`;
  $("bar").style.width = ((idx+1)/pool.length*100)+"%";
  $("qcat").textContent = CATS[q.cat].name + " · #" + q.num;
  $("qtext").textContent = q.text;
  const locked = mode==="practice" && a!==null;
  $("opts").innerHTML = q.opts.map((o,i)=>{
    let cls="opt";
    if (mode==="practice" && a!==null){ if(i===q.correct)cls+=" correct"; else if(i===a)cls+=" wrong"; }
    else if (a===i) cls+=" sel";
    const letter = q.tf ? "" : `<span class="letter">${LETTERS[i]}.</span>`;
    return `<button class="${cls}" data-i="${i}" ${locked?"disabled":""}>${letter}${escapeHTML(o)}</button>`;
  }).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const fb=$("fb");
  if (mode==="practice" && a!==null){
    const ok=a===q.correct; fb.className="feedback "+(ok?"good":"bad");
    fb.textContent = ok ? "✓ Correct!" : "✗ Correct answer: "+(q.tf?"":LETTERS[q.correct]+". ")+q.opts[q.correct];
  } else { fb.className="feedback"; fb.textContent=""; }
  if (mode==="practice"){
    const done=answers.filter(x=>x!==null).length, right=answers.filter((x,i)=>x===pool[i].correct).length;
    $("liveScore").textContent = `${right}/${done} correct`;
  } else {
    $("liveScore").textContent = `${answers.filter(x=>x!==null).length}/${pool.length} answered`;
  }
  $("prevBtn").disabled = idx===0;
  $("nextBtn").textContent = idx===pool.length-1 ? "Finish ✓" : "Next →";
}
function choose(i){
  if (mode==="practice" && answers[idx]!==null) return;
  answers[idx]=i; render();
}
$("prevBtn").onclick=()=>{if(idx>0){idx--;render();}};
$("nextBtn").onclick=()=>{
  if (idx<pool.length-1){idx++;render();}
  else {
    const blank=answers.filter(x=>x===null).length;
    if (blank && !confirm(`${blank} question(s) unanswered. Finish anyway?`)) return;
    finish();
  }
};
$("quitBtn").onclick=()=>{ if(confirm("Quit and see results so far?")) finish(); };

/* ---------- results ---------- */
function finish(){
  clearInterval(timerId);
  $("quiz").classList.add("hidden"); $("results").classList.remove("hidden");
  const right = answers.filter((a,i)=>a===pool[i].correct).length;
  if (mode==="contest"){
    $("finalScore").textContent = (right*4)+" / "+(pool.length*4);
    $("finalSub").textContent = `${right} of ${pool.length} correct · ${Math.round(right/pool.length*100)}%`;
  } else {
    $("finalScore").textContent = Math.round(right/pool.length*100)+"%";
    $("finalSub").textContent = `${right} of ${pool.length} correct`;
  }
  $("breakdown").innerHTML = CATS.map((c,ci)=>{
    const qs = pool.map((q,i)=>({q,i})).filter(x=>x.q.cat===ci);
    if(!qs.length) return "";
    const r = qs.filter(x=>answers[x.i]===x.q.correct).length;
    return `<div><span>${c.name}</span><b>${r}/${qs.length}</b></div>`;
  }).join("");
  const missed = pool.map((q,i)=>({q,a:answers[i]})).filter(x=>x.a!==x.q.correct);
  $("retryMissed").style.display = missed.length ? "" : "none";
  $("retryMissed").onclick=()=>{ mode="practice"; startQuiz(shuffle(missed.map(x=>x.q))); };
  $("review").innerHTML = missed.length ? missed.map(({q,a})=>`
    <div class="review-item">
      <div class="q">#${q.num}. ${escapeHTML(q.text)}</div>
      <div class="yours">Your answer: ${a===null?"(blank)":escapeHTML(q.opts[a])}</div>
      <div class="ans">Correct: ${escapeHTML(q.opts[q.correct])}</div>
    </div>`).join("") : "<p>Perfect — nothing missed! 🌷</p>";
  window.scrollTo(0,0);
}
$("homeBtn").onclick=()=>{ $("results").classList.add("hidden"); $("setup").classList.remove("hidden"); };

function escapeHTML(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

buildCats();
</script>
